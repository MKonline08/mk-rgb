name: Bug report
description: Report a reproducible problem
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected behavior and steps to reproduce.
    validations:
      required: true
  - type: input
    attributes:
      label: MK RGB version and Windows version
    validations:
      required: true
  - type: textarea
    attributes:
      label: Hardware and diagnostics
      description: Include controller model and connection type. Review diagnostic exports before attaching them; remove personal information and never share API tokens.
