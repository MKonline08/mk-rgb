name: Hardware compatibility record
description: Submit evidence for a specific device and channel
body:
  - type: input
    attributes:
      label: Device model, revision, firmware, and connection
    validations:
      required: true
  - type: textarea
    attributes:
      label: Verified capabilities
      description: Distinguish monitoring, RGB, fan control, restore-default behavior, and watchdog support. List exact checks performed and limitations.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Test versions and evidence
      description: Include MK RGB/backend versions and reviewed diagnostics. Do not include serial numbers or private paths.
