name: Build and verify
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
concurrency:
  group: build-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - run: dotnet restore MkRgb.slnx --locked-mode
      - run: dotnet build MkRgb.slnx -c Release --no-restore
      - run: dotnet test tests/MkRgb.Tests/MkRgb.Tests.csproj -c Release --no-build --logger trx
      - run: dotnet list MkRgb.slnx package --vulnerable --include-transitive
      - run: dotnet tool install wix --version 6.0.2 --tool-path .tools
      - run: ./.tools/wix.exe extension add --global WixToolset.Util.wixext/6.0.2
      - shell: pwsh
        run: ./scripts/package.ps1 -Wix "$PWD/.tools/wix.exe"
      - shell: pwsh
        run: ./scripts/verify-install.ps1 -Msi ./artifacts/release/MK-RGB-0.1.1-win-x64.msi -Exe ./artifacts/release/MK-RGB-0.1.1-Setup.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-logs
          path: artifacts/install-logs/*
      - uses: actions/upload-artifact@v4
        with:
          name: MK-RGB-windows
          path: artifacts/release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MK-RGB-windows
          path: artifacts/release
      - name: Publish tested Windows installer and matching sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/release/* --verify-tag --title "MK RGB $GITHUB_REF_NAME" --notes-file docs/release-notes.md --latest
